name: CI

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    # Weekly, so a Wikidata or WDQS change surfaces here before a user reports it.
    - cron: "17 6 * * 1"

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Dataset description is consistent with the data
        run: python scripts/analysis/dataset_stats.py --check
      - name: Offline smoke test
        run: make smoke

  live:
    # Hits the real Wikidata endpoints, so it is manual + weekly rather than
    # on every push: a WDQS outage must not turn every PR red.
    name: live Wikidata check
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Replay released SPARQL programs against live Wikidata
        # No `|| true`: this job exists to surface endpoint breakage. It is
        # scheduled/manual only, so a WDQS outage cannot redden pull requests.
        run: |
          python scripts/eval/SPARQLUpperBound.py \
            --data demo.json --limit 10 \
            --output outputs/ci_sparql_upper_bound.json
